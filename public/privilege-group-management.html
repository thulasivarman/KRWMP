<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privilege Group Management - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
        <div>
          <p class="krwmp-eyebrow">Administration</p>
          <h1 class="krwmp-page-title">Privilege Group Management</h1>
          <p class="krwmp-body-text">Manage only the access keys currently enforced by the KRWMP backend.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="/admin.html"  class="krwmp-btn krwmp-btn-secondary">Back to Admin</a>
          <button id="saveBtn" type="button"  class="krwmp-btn krwmp-btn-primary">Save Changes</button>
        </div>
      </header>

      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>

      <section class="krwmp-panel grid grid-cols-1 xl:grid-cols-4 gap-4 items-end">
        <label  class="krwmp-field xl:col-span-2">User Group
          <select id="roleSelect"  class="krwmp-select mt-1" required>
            <option value="">Loading user groups...</option>
          </select>
        </label>
        <label  class="krwmp-field">Search Module
          <input id="searchInput" type="search"  class="krwmp-input mt-1" placeholder="Search access key">
        </label>
        <div class="flex gap-2">
          <button id="selectAllViewBtn" type="button"  class="krwmp-btn krwmp-btn-secondary flex-1">View All</button>
          <button id="clearAllBtn" type="button"  class="krwmp-btn krwmp-btn-secondary flex-1">Clear</button>
        </div>
        <div id="roleDescription" class="xl:col-span-4 text-xs text-slate-500"></div>
      </section>

      <section class="krwmp-panel overflow-hidden p-0">
        <div class="hidden lg:grid grid-cols-[1.5fr_repeat(4,110px)] gap-0 bg-slate-950/80 border-b border-slate-800 px-4 py-3 text-[11px] uppercase tracking-widest text-slate-500 font-bold">
          <div>Module / Access Key</div>
          <div class="text-center">View</div>
          <div class="text-center">Add</div>
          <div class="text-center">Edit</div>
          <div class="text-center">Delete</div>
        </div>
        <div id="privilegeGrid" class="divide-y divide-slate-800"></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/krwmp-global.js"></script>
  <script src="/assets/js/privilege-guard.js"></script>
  <script src="/privilege-group-management.js"></script>
</body>
</html>

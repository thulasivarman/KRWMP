<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Watershed Intelligence System</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <script>
        try {
            const cachedUser = localStorage.getItem('krwmp_user');
            if (cachedUser) window.location.replace('/map.html');
        } catch (error) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/assets/css/style.css" rel="stylesheet" />
    <style>
        @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .fade-up{animation:fadeUp .7s ease both}.float-soft{animation:floatSoft 5s ease-in-out infinite}
    </style>
</head>
<body class="bg-[#f5f8f4] text-slate-900 font-sans antialiased min-h-screen">
    <main class="min-h-screen grid lg:grid-cols-2">
        <section class="hidden lg:flex relative overflow-hidden bg-gradient-to-br from-emerald-950 via-emerald-800 to-sky-900 text-white p-12 items-end">
            <div class="absolute top-10 left-10 bg-white/90 rounded-3xl px-6 py-4 shadow-xl float-soft">
                <img src="/assets/img/wis-logo.svg" alt="Watershed Intelligence System" class="h-20 w-auto">
            </div>
            <div class="absolute -right-20 -top-20 h-72 w-72 rounded-full bg-sky-300/20 blur-3xl"></div>
            <div class="absolute -left-20 bottom-20 h-72 w-72 rounded-full bg-lime-300/20 blur-3xl"></div>
            <div class="relative max-w-lg fade-up">
                <p class="uppercase tracking-[0.35em] text-xs text-emerald-200 mb-4">Watershed Intelligence System</p>
                <h1 class="text-5xl font-semibold leading-tight">Data-driven watershed decisions for a sustainable future.</h1>
                <p class="mt-5 text-emerald-50/85 leading-7">Ministry of Agriculture, Livestock, Land and Irrigation</p>
            </div>
        </section>

        <section class="flex items-center justify-center p-6 sm:p-10">
            <div class="w-full max-w-md fade-up">
                <a href="/index.html" class="inline-flex items-center gap-2 text-sm text-emerald-800 hover:text-emerald-600 mb-8">← Back to WIS home</a>
                <div class="bg-white border border-emerald-100 rounded-[2rem] p-8 shadow-2xl shadow-emerald-900/10">
                    <div class="mb-7">
                        
                        <h2 class="text-2xl font-semibold text-slate-950">Portal Login</h2>
                        <p class="text-sm text-slate-500 mt-2">Authorized access for Ministry and project stakeholders.</p>
                    </div>

                    <div id="loginAlertBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-sm p-3 rounded-xl mb-4"></div>

                    <form id="portalLoginForm" class="space-y-5">
                        <label class="block">
                            <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username</span>
                            <input type="text" id="loginUsername" placeholder="e.g., thulasi" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100" required>
                        </label>

                        <label class="block">
                            <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</span>
                            <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100" required>
                        </label>

                        <button type="submit" id="loginSubmitBtn" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-900/20">
                            Login to System
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('portalLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlertBox');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (response.ok && result && result.success) {
                    localStorage.setItem('krwmp_user', JSON.stringify(result.user));
                    window.location.href = '/map.html';
                } else {
                    throw new Error(result.message || 'Authentication rejected.');
                }
            } catch (err) {
                alertBox.innerText = err.message || 'Failed to connect to the server.';
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login to System';
            }
        });
    </script>
</body>
</html>

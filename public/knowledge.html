<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Portal - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500/30">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 hidden lg:flex flex-col"></aside>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <section class="krwmp-page-header flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div>
          <p class="krwmp-eyebrow">KRWMP</p>
          <h1 class="krwmp-page-title">Knowledge Portal</h1>
          <p class="krwmp-body-text max-w-3xl">Research articles, PDFs, videos, guidelines and write-ups related to Kelani River Basin catchment management.</p>
        </div>
        <div class="flex gap-2">
          <button id="btn-refresh-knowledge"  class="krwmp-btn krwmp-btn-secondary">Refresh</button>
          <button id="btn-open-create"  class="krwmp-btn krwmp-btn-primary">Add Resource</button>
        </div>
      </section>

      <section id="knowledge-kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></section>

      <section class="krwmp-panel">
        <div class="grid md:grid-cols-6 gap-3">
          <input id="filter-q"  class="krwmp-input md:col-span-2" placeholder="Search title, keyword, abstract">
          <select id="filter-category"  class="krwmp-select"><option value="">All Categories</option></select>
          <select id="filter-type"  class="krwmp-select">
            <option value="">All Types</option><option value="article">Article</option><option value="pdf">PDF</option><option value="video">Video</option><option value="research_paper">Research Paper</option><option value="writeup">Write-up</option><option value="guideline">Guideline</option><option value="case_study">Case Study</option><option value="external_link">External Link</option>
          </select>
          <select id="filter-status"  class="krwmp-select">
            <option value="">All Status</option><option value="draft">Draft</option><option value="submitted">Submitted</option><option value="reviewed">Reviewed</option><option value="published">Published</option><option value="archived">Archived</option>
          </select>
          <button id="btn-apply-filters"  class="krwmp-btn krwmp-btn-primary">Apply</button>
        </div>
      </section>

      <section class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 krwmp-panel overflow-hidden p-0">
          <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <h2 class="krwmp-section-title">Knowledge Resources</h2>
            <span id="resource-count" class="text-xs text-slate-400">0 records</span>
          </div>
          <div id="knowledge-list" class="divide-y divide-slate-800"></div>
        </div>
        <aside class="space-y-6">
          <div class="krwmp-panel">
            <h2 class="krwmp-section-title mb-3">Content by Type</h2>
            <div id="chart-type" class="space-y-2 text-sm"></div>
          </div>
          <div class="krwmp-panel">
            <h2 class="krwmp-section-title mb-3">Pending Review</h2>
            <div id="pending-review" class="space-y-2 text-sm"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="knowledge-modal" class="krwmp-modal krwmp-modal-xl">
    <form id="knowledge-form">
      <header class="krwmp-modal-header">
        <h2 class="krwmp-modal-title">Knowledge Resource</h2>
        <button type="button" id="btn-close-modal" class="krwmp-modal-close" aria-label="Close dialog">&times;</button>
      </header>
      <div class="krwmp-modal-body krwmp-stack-md">
      <input type="hidden" name="id">
      <div class="grid md:grid-cols-2 gap-3">
        <label  class="krwmp-field md:col-span-2">Title<input name="title" required  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Content Type<select name="content_type"  class="krwmp-select mt-1"><option value="article">Article</option><option value="pdf">PDF</option><option value="video">Video</option><option value="research_paper">Research Paper</option><option value="writeup">Write-up</option><option value="guideline">Guideline</option><option value="case_study">Case Study</option><option value="external_link">External Link</option></select></label>
        <label  class="krwmp-field">Category<select name="category_id" id="form-category"  class="krwmp-select mt-1"><option value="">Uncategorised</option></select></label>
        <label  class="krwmp-field">Status<select name="status"  class="krwmp-select mt-1"><option value="draft">Draft</option><option value="submitted">Submitted</option><option value="reviewed">Reviewed</option><option value="published">Published</option><option value="archived">Archived</option></select></label>
        <label  class="krwmp-field">Language<input name="language" value="English"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Publication Year<input name="publication_year" type="number" min="1900" max="2100"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Tags<input name="tags" placeholder="flood, water quality, community"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field md:col-span-2">Summary<textarea name="summary" rows="2"  class="krwmp-textarea mt-1"></textarea></label>
        <label  class="krwmp-field md:col-span-2">Abstract / Write-up<textarea name="abstract" rows="4"  class="krwmp-textarea mt-1"></textarea></label>
        <label  class="krwmp-field">External URL<input name="external_url"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">File URL<input name="file_url"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Video URL<input name="video_url"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Thumbnail URL<input name="thumbnail_url"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Latitude<input name="latitude" type="number" step="any"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field">Longitude<input name="longitude" type="number" step="any"  class="krwmp-input mt-1"></label>
        <label  class="krwmp-field flex items-center gap-2"><input name="is_featured" type="checkbox"  class="rounded"> Featured Resource</label>
      </div>
      </div>
      <footer class="krwmp-modal-actions">
        <button type="button" id="btn-cancel-form"  class="krwmp-btn krwmp-btn-secondary">Cancel</button>
        <button  class="krwmp-btn krwmp-btn-primary">Save Resource</button>
      </footer>
    </form>
  </dialog>

  <script src="/assets/js/krwmp-global.js"></script>
  <script src="/assets/js/privilege-guard.js"></script>
  <script src="/assets/js/knowledge.js"></script>
</body>
</html>

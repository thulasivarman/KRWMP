<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Issue Review - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header">
        <h1 class="krwmp-page-title">Community Issue Review</h1>
        <p class="krwmp-body-text">Review public reports, assign solutions, and update response status.</p>
      </header>
      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>
      <section class="krwmp-panel krwmp-stack-md">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <h2 class="krwmp-section-title">Submitted Reports</h2>
          <button id="refreshBtn"  class="krwmp-btn krwmp-btn-primary">Refresh</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3 bg-slate-950/60 border border-slate-800 rounded-lg p-4">
          <label  class="krwmp-field">Search Issue
            <input id="searchInput" type="search"  class="krwmp-input mt-1" placeholder="Search code, title, description, location">
          </label>
          <label  class="krwmp-field">Status
            <select id="statusFilter"  class="krwmp-select mt-1"><option value="">All Statuses</option></select>
          </label>
          <label  class="krwmp-field">Issue Category
            <select id="categoryFilter"  class="krwmp-select mt-1"><option value="">All Categories</option></select>
          </label>
          <label  class="krwmp-field">Severity
            <select id="severityFilter"  class="krwmp-select mt-1"><option value="">All Severities</option></select>
          </label>
          <div class="flex items-end gap-2">
            <button id="clearFiltersBtn" type="button"  class="krwmp-btn krwmp-btn-secondary krwmp-btn-full">Clear Filters</button>
          </div>
        </div>
        <div id="filterSummary" class="text-xs text-slate-500"></div>
        <div id="reportsList" class="space-y-4"></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/krwmp-global.js"></script><script src="/assets/js/privilege-guard.js"></script><script src="/admin-community-issues.js"></script>
</body>
</html>

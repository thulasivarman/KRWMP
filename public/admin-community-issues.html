<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Issue Review - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 p-8 space-y-6 max-w-7xl mx-auto">
      <header class="border-b border-slate-800 pb-4">
        <h1 class="text-xl font-bold uppercase tracking-wider text-slate-200">Community Issue Review</h1>
        <p class="text-xs text-slate-500 mt-1">Review public reports, assign solutions, and update response status.</p>
      </header>
      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>
      <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Submitted Reports</h2>
          <button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold">Refresh</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3 bg-slate-950/60 border border-slate-800 rounded-lg p-4">
          <label class="text-xs font-semibold text-slate-300">Search Issue
            <input id="searchInput" type="search" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="Search code, title, description, location">
          </label>
          <label class="text-xs font-semibold text-slate-300">Status
            <select id="statusFilter" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm"><option value="">All Statuses</option></select>
          </label>
          <label class="text-xs font-semibold text-slate-300">Issue Category
            <select id="categoryFilter" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm"><option value="">All Categories</option></select>
          </label>
          <label class="text-xs font-semibold text-slate-300">Severity
            <select id="severityFilter" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm"><option value="">All Severities</option></select>
          </label>
          <div class="flex items-end gap-2">
            <button id="clearFiltersBtn" type="button" class="w-full bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm font-bold">Clear Filters</button>
          </div>
        </div>
        <div id="filterSummary" class="text-xs text-slate-500"></div>
        <div id="reportsList" class="space-y-4"></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/krwmp-global.js"></script><script src="/admin-community-issues.js"></script>
</body>
</html>

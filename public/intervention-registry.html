<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Intervention Registry - KRWMP Portal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="flex min-h-screen"><div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div><main class="flex-1 p-8 space-y-6 max-w-7xl mx-auto w-full"><header class="border-b border-slate-800 pb-4"><p class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Intervention Registry</p><h1 class="text-xl font-bold uppercase tracking-wider text-slate-200 mt-1">Implementation Tracking</h1><p class="text-xs text-slate-500 mt-1">Register intervention locations, update progress, track actions and assigned officers.</p></header><section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section><section id="writePanel" class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4 hidden"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Add / Edit Intervention</h2><form id="registryForm" class="grid grid-cols-1 md:grid-cols-4 gap-4"><input type="hidden" name="id"><label class="text-sm font-semibold">Library Type<select name="library_id" id="librarySelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></select></label><label class="text-sm font-semibold md:col-span-2">Intervention Title<input name="intervention_title" required class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Status<select name="status" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="planned">Planned</option><option value="ongoing">Ongoing</option><option value="delayed">Delayed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label class="text-sm font-semibold">Priority<select name="priority" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label class="text-sm font-semibold">Progress %<input name="progress_percent" type="number" min="0" max="100" value="0" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Location<input name="location_name" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Village<input name="village_name" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">DSD<select name="dsd_name" id="dsdSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="">Select DSD</option></select></label><label class="text-sm font-semibold">GND<select name="gnd_name" id="gndSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="">Select DSD first</option></select></label><label class="text-sm font-semibold">Latitude<input name="latitude" id="latInput" type="number" step="any" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Longitude<input name="longitude" id="lngInput" type="number" step="any" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Planned Start<input name="planned_start_date" type="date" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Planned End<input name="planned_end_date" type="date" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Actual Start<input name="actual_start_date" type="date" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Actual End<input name="actual_end_date" type="date" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Lead Officer<input name="lead_officer_name" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Lead Contact<input name="lead_officer_contact" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Implementing Institution<select name="implementing_office" id="institutionSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="">Select institution</option></select></label><label class="text-sm font-semibold">Remarks<input name="remarks" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><div class="md:col-span-4 flex gap-2"><button type="button" id="useLocationBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm font-bold">Use Current Location</button><button class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold">Save Intervention</button><button type="button" id="resetBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm font-bold">Reset</button></div></form></section><section class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between mb-4"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Registered Interventions</h2><button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold">Refresh</button></div><div id="registryList" class="space-y-4"></div></section></main></div><script src="/assets/js/krwmp-global.js"></script><script src="/intervention-registry.js"></script><script src="/intervention-accordion-enhance.js"></script></body></html>

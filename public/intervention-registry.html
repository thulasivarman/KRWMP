<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Intervention Registry - KRWMP Portal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="flex min-h-screen"><div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div><main class="flex-1 krwmp-page krwmp-stack-lg"><header class="krwmp-page-header"><p class="krwmp-eyebrow">Intervention Registry</p><h1 class="krwmp-page-title">Implementation Tracking</h1><p class="krwmp-body-text">Register intervention locations, update progress, track actions and assigned officers.</p></header><section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section><section id="writePanel" class="krwmp-panel krwmp-stack-md hidden"><h2 class="krwmp-section-title">Add / Edit Intervention</h2><form id="registryForm" class="grid grid-cols-1 md:grid-cols-4 gap-4"><input type="hidden" name="id"><label  class="krwmp-field">Library Type<select name="library_id" id="librarySelect"  class="krwmp-select mt-1"></select></label><label  class="krwmp-field md:col-span-2">Intervention Title<input name="intervention_title" required  class="krwmp-input mt-1"></label><label  class="krwmp-field">Status<select name="status"  class="krwmp-select mt-1"><option value="planned">Planned</option><option value="ongoing">Ongoing</option><option value="delayed">Delayed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label  class="krwmp-field">Priority<select name="priority"  class="krwmp-select mt-1"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label  class="krwmp-field">Progress %<input name="progress_percent" type="number" min="0" max="100" value="0"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Location<input name="location_name"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Village<input name="village_name"  class="krwmp-input mt-1"></label><label  class="krwmp-field">DSD<select name="dsd_name" id="dsdSelect"  class="krwmp-select mt-1"><option value="">Select DSD</option></select></label><label  class="krwmp-field">GND<select name="gnd_name" id="gndSelect"  class="krwmp-select mt-1"><option value="">Select DSD first</option></select></label><label  class="krwmp-field">Latitude<input name="latitude" id="latInput" type="number" step="any"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Longitude<input name="longitude" id="lngInput" type="number" step="any"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Planned Start<input name="planned_start_date" type="date"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Planned End<input name="planned_end_date" type="date"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Actual Start<input name="actual_start_date" type="date"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Actual End<input name="actual_end_date" type="date"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Lead Officer<input name="lead_officer_name"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Lead Contact<input name="lead_officer_contact"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Implementing Institution<select name="implementing_office" id="institutionSelect"  class="krwmp-select mt-1"><option value="">Select institution</option></select></label><label  class="krwmp-field">Remarks<input name="remarks"  class="krwmp-input mt-1"></label><div class="md:col-span-4 flex gap-2"><button type="button" id="useLocationBtn"  class="krwmp-btn krwmp-btn-secondary">Use Current Location</button><button  class="krwmp-btn krwmp-btn-primary">Save Intervention</button><button type="button" id="resetBtn"  class="krwmp-btn krwmp-btn-secondary">Reset</button></div></form></section><section class="krwmp-panel"><div class="flex justify-between mb-4"><h2 class="krwmp-section-title">Registered Interventions</h2><button id="refreshBtn"  class="krwmp-btn krwmp-btn-primary">Refresh</button></div><div id="registryList" class="space-y-4"></div></section></main></div><script src="/assets/js/krwmp-global.js"></script><script src="/assets/js/privilege-guard.js"></script><script src="/intervention-registry.js"></script><script src="/intervention-accordion-enhance.js"></script></body></html>

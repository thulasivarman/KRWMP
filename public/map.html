<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRWMP Portal - Spatial Analytics Canvas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <link href="/assets/css/style.css" rel="stylesheet" />
    
    <script src="/assets/js/krwmp-global.js"></script>
    <script src="/assets/js/layers-config.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col h-screen">

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="absolute left-0 top-0 h-full w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-40 transition-transform duration-300 transform translate-x-0"></aside>

        <button onclick="toggleSidebar()" class="absolute left-4 top-4 z-50 bg-slate-950 text-slate-300 hover:text-white border border-slate-800 p-2.5 rounded-md shadow-lg flex items-center justify-center focus:outline-none transition" title="Toggle Sidebar Menu">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <main id="map" class="w-full h-full"></main>
    </div>

    <footer class="bg-slate-950 border-t border-slate-800 px-6 py-2.5 z-30 text-center md:flex md:justify-between md:items-center text-xs tracking-wide text-slate-400">
        <p class="font-medium text-slate-300">This site was developed under the <span class="text-emerald-400 font-semibold">Kelani River Basin Management Plan Project</span>.</p>
        <p class="mt-1 md:mt-0 uppercase text-[10px] tracking-widest text-slate-500 font-bold">Ministry of Agriculture</p>
    </footer>

    <script>
        // =============================================================
        // 1. INITIALIZE INTERACTIVE MAP ENVIRONMENT BASE RASTER LAYERS
        // =============================================================
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'osm-raster-tiles': {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap contributors'
                    }
                },
                layers: [{ id: 'osm-layer', type: 'raster', source: 'osm-raster-tiles', minzoom: 0, maxzoom: 19 }]
            },
            center: [80.20, 6.95], // Centered around the Kelani River Basin domain context
            zoom: 9,
            pitch: 0
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // =============================================================
        // 2. SYNCHRONIZED INTERFACE COMPILATION & VECTOR PIPELINE
        // =============================================================
        map.on('load', async () => {
            console.log("🗺️ Map canvas style loaded. Resolving UI layout components...");
            
            try {
                // Force engine to completely load structural sidebar markup into the active DOM layout
                await window.KRWMP_ENGINE.assembleInterfaceContext('/sidebar.html', 'sidebar');
                
                // Construct dynamic layer checkbox components now that target nodes are guaranteed present
                buildDynamicLayerControls();
                console.log("✅ Layer controls safely injected into sidebar container.");

                // Inject central vector registry data sources securely from layers-config.js
                if (typeof krwmpLayersRegistry !== 'undefined') {
                    krwmpLayersRegistry.forEach(layer => {
                        // Prevent duplicate layout registration anomalies
                        if (map.getSource(`${layer.id}-source`)) return;

                        map.addSource(`${layer.id}-source`, { type: 'geojson', data: layer.url });
                        const visibilityValue = layer.defaultVisible ? 'visible' : 'none';

                        if (layer.type === 'polygon') {
                            map.addLayer({
                                id: `${layer.id}-fill`, 
                                type: 'fill', 
                                source: `${layer.id}-source`,
                                layout: { 'visibility': visibilityValue },
                                paint: { 'fill-color': layer.symbology.fillColor, 'fill-opacity': layer.symbology.fillOpacity }
                            });
                            
                            map.addLayer({
                                id: `${layer.id}-line`, 
                                type: 'line', 
                                source: `${layer.id}-source`,
                                layout: { 'visibility': visibilityValue },
                                paint: { 'line-color': layer.symbology.strokeColor, 'line-width': layer.symbology.strokeWidth }
                            });
                            
                            attachMouseHoverControl(`${layer.id}-fill`);
                            attachMouseHoverControl(`${layer.id}-line`);
                        } 
                        else if (layer.type === 'line') {
                            map.addLayer({
                                id: `${layer.id}-line`, 
                                type: 'line', 
                                source: `${layer.id}-source`,
                                layout: { 'visibility': visibilityValue },
                                paint: { 'line-color': layer.symbology.strokeColor, 'line-width': layer.symbology.strokeWidth }
                            });
                            attachMouseHoverControl(`${layer.id}-line`);
                        }
                    });
                    console.log("🚀 All GeoJSON spatial vectors successfully registered onto WebGL canvas.");
                }

            } catch (err) {
                console.error("❌ Critical failure during spatial environment initialization:", err);
            }
        });

        // =============================================================
        // 3. DYNAMIC LAYER CONTROL SIDEBAR GENERATOR ENGINE
        // =============================================================
        function buildDynamicLayerControls() {
            const container = document.getElementById('dynamicLayerContainer');
            if (!container) {
                console.warn("⚠️ Target layer container [#dynamicLayerContainer] not found in the sidebar DOM.");
                return;
            }

            if (typeof krwmpLayersRegistry === 'undefined' || !Array.isArray(krwmpLayersRegistry)) {
                console.error("❌ krwmpLayersRegistry is missing or invalid.");
                return;
            }

            let htmlContent = '';
            
            krwmpLayersRegistry.forEach((layer, idx) => {
                const isChecked = layer.defaultVisible ? 'checked' : '';
                const paddingTopClass = idx === 0 ? 'pt-1' : 'pt-2';
                
                // Defensive fallbacks to shield engine against undefined registry elements
                const symbology = layer.symbology || {};
                const legendType = symbology.legendType || 'polygon';
                const legendText = symbology.legendText || 'Layer Symbology Metrics';
                const strokeColor = symbology.strokeColor || '#cbd5e1';
                const fillColor = symbology.fillColor || '#94a3b8';

                let legendGraphicHTML = '';
                if (legendType === 'polygon') {
                    legendGraphicHTML = `<div class="w-6 h-4 rounded-sm flex-shrink-0 border-2" style="border-color: ${strokeColor}; background-color: ${fillColor}33;"></div>`;
                } else if (legendType === 'line') {
                    legendGraphicHTML = `<div class="w-6 h-0.5 flex-shrink-0" style="background-color: ${strokeColor};"></div>`;
                }

                htmlContent += `
                    <div class="${paddingTopClass}">
                        <div class="flex items-center justify-between">
                            <label class="flex items-center gap-3 text-sm cursor-pointer text-slate-400 hover:text-white transition-colors select-none">
                                <input type="checkbox" id="checkbox-${layer.id}" ${isChecked} 
                                    onchange="toggleRegistryLayer('${layer.id}')" 
                                    class="rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-0 cursor-pointer">
                                ${layer.name}
                            </label>
                            <button onclick="toggleSection('legend-${layer.id}', 'icon-${layer.id}')" class="text-slate-500 hover:text-emerald-400 p-1 transition" title="View Info">
                                <svg id="icon-${layer.id}" class="h-4 w-4 rotate-icon collapsed" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </button>
                        </div>
                        <div id="legend-${layer.id}" class="accordion-content collapsed ml-7">
                            <div class="mt-2 flex items-center gap-3 bg-slate-950/40 p-2.5 rounded border border-slate-800/80">
                                ${legendGraphicHTML}
                                <div class="text-[10px] leading-tight text-slate-500 tracking-wide">
                                    <span class="text-slate-400 font-bold block mb-0.5 uppercase tracking-wider text-[9px]">Symbology</span>
                                    ${legendText}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = htmlContent;
        }

        // =============================================================
        // 4. METADATA POPUP ENGINE (STABLE WHITE INFOMINERS WINDOW)
        // =============================================================
        const targetClickableLayers = [
            'kelani-basin-fill', 'kelani-basin-line',
            'dsd-boundary-fill', 'dsd-boundary-line',
            'gnd-boundary-fill', 'gnd-boundary-line'
        ];

        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: targetClickableLayers });
            if (!features || features.length === 0) return;

            const clickedFeature = features.find(f => f.properties && Object.keys(f.properties).length > 0) || features[0];
            const properties = clickedFeature.properties;

            const layerId = clickedFeature.layer.id.replace(/-(fill|line)$/, '');
            const layerMetadata = krwmpLayersRegistry.find(l => l.id === layerId) || { name: "Spatial Layer", popupFields: [] };

            let popupHtmlContent = `
                <div style="font-family: Arial, sans-serif; min-width: 240px; max-width: 320px; color: #1e293b;">
                    <div style="font-weight: 700; font-size: 13px; text-transform: uppercase; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 6px; letter-spacing: 0.025em;">
                        ${layerMetadata.name}
                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 11px; line-height: 1.4;">
                        <tbody>
            `;

            if (layerMetadata.popupFields && layerMetadata.popupFields.length > 0) {
                layerMetadata.popupFields.forEach(field => {
                    const rawVal = properties[field.key];
                    const cleanDisplayValue = (rawVal !== null && rawVal !== undefined) ? rawVal : 'N/A';
                    popupHtmlContent += `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 5px 0; font-weight: 600; color: #64748b; width: 45%; vertical-align: top;">${field.label}:</td>
                            <td style="padding: 5px 0; font-weight: 500; color: #0f172a; text-align: right; word-break: break-all;">${cleanDisplayValue}</td>
                        </tr>
                    `;
                });
            } else {
                for (const [key, value] of Object.entries(properties)) {
                    const cleanKeyLabel = key.replace(/_/g, ' ');
                    popupHtmlContent += `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 5px 0; font-weight: 600; color: #64748b; text-transform: capitalize; width: 45%; vertical-align: top;">${cleanKeyLabel}:</td>
                            <td style="padding: 5px 0; font-weight: 500; color: #0f172a; text-align: right; word-break: break-all;">${value !== null && value !== undefined ? value : 'N/A'}</td>
                        </tr>
                    `;
                }
            }

            popupHtmlContent += `</tbody></table></div>`;

            new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: 'none' })
                .setLngLat(e.lngLat)
                .setHTML(popupHtmlContent)
                .addTo(map);
        });

        // =============================================================
        // 5. CORE CONTROLLERS & UTILITY INTERFACE INTERACTIONS
        // =============================================================
        function attachMouseHoverControl(layerTargetId) {
            map.on('mouseenter', layerTargetId, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layerTargetId, () => { map.getCanvas().style.cursor = ''; });
        }

        // Window sidebar sliding layout transition control
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('translate-x-0');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Accordion collapsing layout transition control
        function toggleSection(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (content && icon) {
                content.classList.toggle('collapsed');
                icon.classList.toggle('collapsed');
            }
        }

        // Active layer toggle mapping layout visibility sync
        function toggleRegistryLayer(layerId) {
            const checkbox = document.getElementById(`checkbox-${layerId}`);
            if (!checkbox) return;
            
            const visibilityState = checkbox.checked ? 'visible' : 'none';

            if (map.getLayer(`${layerId}-line`)) {
                map.setLayoutProperty(`${layerId}-line`, 'visibility', visibilityState);
            }
            if (map.getLayer(`${layerId}-fill`)) {
                map.setLayoutProperty(`${layerId}-fill`, 'visibility', visibilityState);
            }
        }
    </script>
</body>
</html>

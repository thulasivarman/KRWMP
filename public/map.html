<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Visualization Workspace - KRWMP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="/vendor/maplibre/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500/30 overflow-hidden">
    <div class="flex h-screen w-screen overflow-hidden">
        <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20"></div>
        <div class="flex-1 relative h-full">
            <div id="map-canvas" class="absolute inset-0 h-full w-full z-10"></div>
            <div id="map-loading-indicator" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-40 bg-slate-900 text-white text-xs px-4 py-2 rounded-lg shadow-lg">Loading layer...</div>
            <div id="map-export-toolbar" class="absolute bottom-6 right-6 z-20 flex gap-2 text-xs">
                <button id="btn-map-print" type="button" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-200 px-3 py-2 rounded-lg shadow-xl backdrop-blur-md flex items-center gap-1.5 transition">Print</button>
                <button id="btn-map-export" type="button" class="bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-500/40 text-white px-3 py-2 rounded-lg shadow-xl backdrop-blur-md flex items-center gap-1.5 transition">Export PNG</button>
            </div>
            <a href="/community-report.html" class="absolute top-6 left-6 z-20 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-xl">Report Issue</a>
            <div id="data-layers-panel" class="hidden absolute top-6 right-6 w-80 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-xl p-5 shadow-2xl z-20 text-xs">
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-4"><h3 class="font-bold tracking-wider uppercase text-slate-200">Vector Layer Matrix</h3><button id="btn-close-layer-panel" class="text-slate-400 hover:text-white font-bold text-base">&times;</button></div>
                <div id="dynamic-layer-control-list" class="space-y-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Loading database layers...</div></div>
            </div>
            <div id="raster-layers-panel" class="hidden absolute top-6 right-6 w-80 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-xl p-5 shadow-2xl z-20 text-xs">
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-4"><h3 class="font-bold tracking-wider uppercase text-slate-200">Raster Layer Overlays</h3><button id="btn-close-raster-layer-panel" class="text-slate-400 hover:text-white font-bold text-base">&times;</button></div>
                <div id="raster-layer-control-list" class="space-y-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Loading raster layers...</div></div>
            </div>
        </div>
    </div>
<script src="/assets/js/krwmp-global.js"></script>
<script src="/assets/js/layer-registry.js"></script>
<script src="/assets/js/map-init.js"></script>
<script src="/assets/js/popup-manager.js"></script>
<script src="/assets/js/ui-manager.js"></script>
<script src="/assets/js/layer-manager.js"></script>
<script src="/assets/js/raster-layer-manager.js"></script>
<script src="/assets/js/community-issues-map.js"></script>
<script src="/assets/js/map-export.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/vendor/maplibre/maplibre-gl.js"></script>
</body>
</html>

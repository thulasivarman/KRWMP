<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Visualization Workspace - KRWMP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="/vendor/maplibre/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500/30 overflow-hidden">
    <a href="#map-canvas" class="krwmp-skip-link">Skip to map</a>
    <div class="flex h-screen w-screen overflow-hidden">
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-30 krwmp-sidebar" aria-label="System navigation"></aside>
        <main class="flex-1 relative h-full" aria-label="GIS map workspace">
            <button id="mobile-sidebar-toggle" type="button" class="krwmp-mobile-menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation menu">☰</button>
            <div id="map-canvas" class="absolute inset-0 h-full w-full z-10" tabindex="0" aria-label="Interactive watershed map"></div>
            <div id="map-loading-indicator" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-40 bg-slate-900 text-white text-xs px-4 py-2 rounded-lg shadow-lg" role="status" aria-live="polite">Loading layer...</div>

            <div class="krwmp-map-toolbar absolute top-6 left-20 z-20 flex flex-wrap gap-2 text-xs" role="toolbar" aria-label="Map layer controls">
                <button id="floating-data-layers-btn" type="button" class="krwmp-map-btn" aria-controls="data-layers-panel" aria-expanded="false">Data Layers</button>
                <button id="floating-raster-layers-btn" type="button" class="krwmp-map-btn" aria-controls="raster-layers-panel" aria-expanded="false">Raster Layers</button>
                <button id="btn-zoom-basin" type="button" class="krwmp-map-btn">Zoom to Basin</button>
                <button id="btn-clear-map-selection" type="button" class="krwmp-map-btn">Clear</button>
            </div>

            <div class="absolute top-6 right-6 z-20 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-lg shadow-xl p-2 text-xs krwmp-basemap-box">
                <label for="basemap-selector" class="sr-only">Select basemap</label>
                <select id="basemap-selector" class="bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    <option value="light">Light Map</option>
                    <option value="satellite">Satellite</option>
                    <option value="terrain">Terrain / Topographic</option>
                    <option value="hillshade">Hillshade Relief</option>
                    <option value="dark">Dark Map</option>
                </select>
            </div>

            <div id="map-export-toolbar" class="absolute bottom-6 right-6 z-20 flex gap-2 text-xs" role="toolbar" aria-label="Map export controls">
                <button id="btn-map-print" type="button" class="krwmp-map-btn">Print</button>
                <button id="btn-map-export" type="button" class="krwmp-map-btn-primary">Export PNG</button>
            </div>

            <section id="data-layers-panel" class="hidden krwmp-layer-panel absolute top-20 right-6 w-80 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl p-5 shadow-2xl z-20 text-xs" aria-label="Vector layer controls">
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-4">
                    <h2 class="font-bold tracking-wider uppercase text-slate-200">Vector Layer Matrix</h2>
                    <button id="btn-close-layer-panel" type="button" class="text-slate-400 hover:text-white font-bold text-base focus:outline-none focus:ring-2 focus:ring-emerald-400 rounded" aria-label="Close vector layer panel">&times;</button>
                </div>
                <div id="dynamic-layer-control-list" class="space-y-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Loading database layers...</div></div>
            </section>

            <section id="raster-layers-panel" class="hidden krwmp-layer-panel absolute top-20 right-6 w-80 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl p-5 shadow-2xl z-20 text-xs" aria-label="Raster layer controls">
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-4">
                    <h2 class="font-bold tracking-wider uppercase text-slate-200">Raster Layer Overlays</h2>
                    <button id="btn-close-raster-layer-panel" type="button" class="text-slate-400 hover:text-white font-bold text-base focus:outline-none focus:ring-2 focus:ring-emerald-400 rounded" aria-label="Close raster layer panel">&times;</button>
                </div>
                <div id="raster-layer-control-list" class="space-y-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Loading raster layers...</div></div>
            </section>
        </main>
    </div>
<script src="/assets/js/krwmp-global.js"></script>
<script src="/assets/js/krwmp-ui-enhancements.js"></script>
<script src="/assets/js/layer-registry.js"></script>
<script src="/assets/js/map-init.js"></script>
<script src="/assets/js/popup-manager.js"></script>
<script src="/assets/js/ui-manager.js"></script>
<script src="/assets/js/layer-manager.js"></script>
<script src="/assets/js/raster-layer-manager.js"></script>
<script src="/assets/js/community-issues-map.js"></script>
<script src="/assets/js/water-quality-map.js"></script>
<script src="/assets/js/knowledge-map.js"></script>
<script src="/assets/js/map-export.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/vendor/maplibre/maplibre-gl.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quality Test Records - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div><p class="krwmp-eyebrow">Water Quality</p><h1 class="krwmp-page-title">Water Quality Test Records</h1><p class="krwmp-body-text">Record physical, chemical and biological parameters with signed PDF report.</p></div>
        <button id="reloadBtn"  class="krwmp-btn krwmp-btn-secondary">Reload</button>
      </header>
      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>
      <section class="grid grid-cols-1 xl:grid-cols-3 gap-5">
        <form id="waterQualityForm" class="xl:col-span-2 krwmp-panel grid grid-cols-1 md:grid-cols-2 gap-4">
          <label  class="form-label">Sample Code<input name="sample_code"  class="form-input mt-1" placeholder="Auto-generated if blank"></label>
          <label  class="form-label">Sample Location Name<input name="sample_location_name"  class="form-input mt-1" required></label>
          <label  class="form-label">Collection Date & Time<input name="sample_collection_datetime" type="datetime-local"  class="form-input mt-1" required></label>
          <label  class="form-label">Collected By<input name="collected_by"  class="form-input mt-1" required></label>
          <section class="md:col-span-2 krwmp-map-panel space-y-3">
            <div id="wqLocationPicker" class="space-y-2"><div data-location-map class="krwmp-location-map h-72"></div><p data-location-status class="krwmp-status-label">Click the map to select sample location.</p></div>
            <input type="hidden" name="latitude" id="latitudeInput" required><input type="hidden" name="longitude" id="longitudeInput" required>
            <input type="hidden" name="dsd_name" id="dsdNameInput"><input type="hidden" name="gnd_name" id="gndNameInput"><input type="hidden" name="sub_watershed_id" id="subWatershedIdInput"><input type="hidden" name="sub_watershed_name" id="subWatershedNameInput">
            <div id="locationInfo" class="krwmp-identify-panel">No location selected.</div>
          </section>
          <div class="md:col-span-2"><h2 class="form-section-heading mb-3">Parameters</h2><div id="parameterTabs" class="flex flex-wrap gap-2 mb-3"></div><div id="parameterGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[520px] overflow-y-auto pr-2"></div></div>
          <label  class="form-label md:col-span-2">Remarks<textarea name="remarks" rows="3"  class="form-textarea mt-1"></textarea></label>
          <label  class="form-label md:col-span-2">Signed Water Quality Report PDF<input name="signed_report_pdf" type="file" accept="application/pdf,.pdf"  class="form-input mt-1"></label>
          <div class="md:col-span-2"><button  class="krwmp-btn krwmp-btn-primary">Save Water Quality Record</button></div>
        </form>
        <section class="krwmp-panel krwmp-stack-md"><h2 class="form-section-heading">Saved Records</h2><input id="searchInput" type="search"  class="form-input" placeholder="Search sample/location/collector"><select id="statusFilter"  class="form-select"><option value="">All Statuses</option><option value="compliant">Compliant</option><option value="caution">Caution</option><option value="non_compliant">Non-compliant</option><option value="not_assessed">Not assessed</option></select><div id="recordsList" class="space-y-3"></div></section>
      </section>
    </main>
  </div>
  <script src="/assets/js/krwmp-global.js"></script><script src="/assets/js/privilege-guard.js"></script><script src="/assets/js/location-picker.js"></script><script src="/water-quality-records.js"></script>
</body>
</html>

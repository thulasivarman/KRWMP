<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catchment Home - WIS</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatGlow { 0%,100% { transform: translateY(0) scale(1); opacity: .75; } 50% { transform: translateY(-14px) scale(1.04); opacity: 1; } }
        @keyframes softPulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 8px 14px rgba(15,23,42,.14)); } 50% { transform: scale(1.08); filter: drop-shadow(0 14px 22px rgba(15,23,42,.2)); } }
        .fade-up { animation: fadeUp .55s ease both; }
        .hero-glow { animation: floatGlow 7s ease-in-out infinite; }
        .wis-glass { background: rgba(255,255,255,.86); backdrop-filter: blur(20px); }
        .wis-dark-glass { background: rgba(15,23,42,.55); backdrop-filter: blur(18px); }
        .wis-card, .pulse-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
        .wis-card:hover, .pulse-card:hover { transform: translateY(-4px); box-shadow: 0 24px 50px rgba(15,23,42,.18); }
        .pulse-card:hover .pulse-icon { animation: softPulse 1.6s ease-in-out infinite; }
        .mini-bars span { display: block; width: .38rem; border-radius: 999px 999px 0 0; opacity: .82; transition: height .25s ease, opacity .2s ease; }
        .pulse-card:hover .mini-bars span { opacity: 1; }
    </style>
</head>
<body class="bg-[#f4fbf7] text-slate-900 min-h-screen antialiased overflow-x-hidden">
<!-- unchanged body content above -->
<script src="/assets/js/krwmp-global.js"></script>
<script src="/assets/js/krwmp-ui-enhancements.js"></script>
<script>
const fmt = new Intl.NumberFormat('en-US');
const fmtNum = value => fmt.format(Number(value) || 0);
const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
const setBar = (id, value) => { const el = document.getElementById(id); if (el) el.style.width = `${Math.max(0, Math.min(100, Number(value) || 0))}%`; };

function renderDistribution(id, rows = [], theme = 'green') {
    const container = document.getElementById(id);
    if (!container) return;
    if (!rows.length) {
        container.innerHTML = '<p class="text-sm text-slate-500">No records available.</p>';
        return;
    }
    const max = Math.max(...rows.map(row => Number(row.count) || 0), 1);
    const themes = {
        issue: ['from-rose-600 to-red-400', 'from-red-500 to-orange-400'],
        pollution: ['from-red-700 to-rose-500', 'from-orange-600 to-red-400'],
        solution: ['from-emerald-600 to-lime-400', 'from-green-500 to-emerald-400'],
        water: ['from-sky-600 to-cyan-400', 'from-blue-500 to-sky-400']
    };
    const colors = themes[theme] || themes.solution;

    container.innerHTML = rows.map((row, index) => {
        const count = Number(row.count) || 0;
        const width = Math.max(8, Math.round((count / max) * 100));
        const label = String(row.label || 'Unclassified').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

        return `<div class="rounded-xl bg-white/70 p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            <div class="flex justify-between gap-3 text-sm">
                <span class="truncate text-slate-700">${label}</span>
                <strong>${fmtNum(count)}</strong>
            </div>
            <div class="mt-2 h-2.5 rounded-full bg-white border border-slate-200 overflow-hidden">
                <div class="h-full bg-gradient-to-r ${colors[index % colors.length]} transition-all duration-500" style="width:${width}%"></div>
            </div>
        </div>`;
    }).join('');
}
</script>
</body>
</html>

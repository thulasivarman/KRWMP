<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Issue & Solution Library - KRWMP Portal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="flex min-h-screen"><div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div><main class="flex-1 p-8 space-y-6 max-w-7xl mx-auto"><header class="border-b border-slate-800 pb-4"><h1 class="text-xl font-bold uppercase tracking-wider text-slate-200">Issue & Solution Library</h1><p class="text-xs text-slate-500 mt-1">Maintain selectable issue categories and recommended solutions for community reports.</p></header><section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section><section class="grid grid-cols-1 lg:grid-cols-2 gap-6"><form id="categoryForm" class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Add Issue Category</h2><input name="category_name" required placeholder="Category name" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><textarea name="description" placeholder="Description" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></textarea><select name="severity_level" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select><button class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold text-sm">Save Category</button></form><form id="solutionForm" class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Add Recommended Solution</h2><select name="category_id" id="solutionCategory" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2" required></select><input name="solution_title" required placeholder="Solution title" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><textarea name="solution_description" required placeholder="Solution description" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></textarea><textarea name="recommended_actions" placeholder="Recommended actions" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></textarea><button class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold text-sm">Save Solution</button></form></section><section class="bg-slate-900 border border-slate-800 rounded-xl p-5"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold mb-4">Library Records</h2><div id="libraryList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div></section></main></div><script src="/assets/js/krwmp-global.js"></script><script src="/admin-solution-library.js"></script></body></html>

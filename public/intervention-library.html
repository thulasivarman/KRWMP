<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervention Library - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div>
          <p class="krwmp-eyebrow">Intervention Library</p>
          <h1 class="krwmp-page-title">Admin Intervention Library</h1>
          <p class="krwmp-body-text">Admin managed catalogue of standard watershed interventions.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a id="addLibraryBtn" href="/intervention-library-form.html" class="krwmp-btn krwmp-btn-primary hidden">Add Library Item</a>
          <button id="refreshBtn" class="krwmp-btn krwmp-btn-secondary">Refresh</button>
        </div>
      </header>
      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>
      <section class="krwmp-panel krwmp-stack-md">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <h2 class="form-section-heading">Library Records</h2>
          <input id="searchInput" class="form-input md:max-w-md" placeholder="Search intervention name, category or institution">
        </div>
        <div id="libraryList" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <dialog id="viewModal" class="krwmp-modal krwmp-modal-xl">
    <header class="krwmp-modal-header">
      <h2 class="krwmp-modal-title">Intervention Library Details</h2>
      <button type="button" class="krwmp-modal-close" data-close-modal="viewModal" aria-label="Close details">&times;</button>
    </header>
    <div id="viewModalContent" class="krwmp-modal-body krwmp-stack-md"></div>
    <footer class="krwmp-modal-actions">
      <button type="button" class="krwmp-btn krwmp-btn-secondary" data-close-modal="viewModal">Close</button>
    </footer>
  </dialog>

  <script src="/assets/js/krwmp-global.js"></script>
  <script src="/assets/js/privilege-guard.js"></script>
  <script src="/intervention-library.js"></script>
</body>
</html>

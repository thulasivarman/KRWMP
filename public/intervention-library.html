<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Intervention Library - KRWMP Portal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="flex min-h-screen"><div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div><main class="flex-1 p-8 space-y-6 max-w-7xl mx-auto w-full"><header class="border-b border-slate-800 pb-4"><p class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Intervention Library</p><h1 class="text-xl font-bold uppercase tracking-wider text-slate-200 mt-1">Admin Intervention Library</h1><p class="text-xs text-slate-500 mt-1">Admin managed catalogue of standard watershed interventions.</p></header><section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section><section id="writePanel" class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4 hidden"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Add / Edit Library Item</h2><form id="libraryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4"><input type="hidden" name="id"><label class="text-sm font-semibold">Intervention Name<input name="intervention_name" required class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Category<input name="intervention_category" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Priority<select name="default_priority" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label class="text-sm font-semibold md:col-span-3">Description<textarea name="description" rows="3" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></textarea></label><label class="text-sm font-semibold md:col-span-3">Standard Actions<textarea name="standard_actions" rows="3" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></textarea></label><label class="text-sm font-semibold">Expected Outputs<input name="expected_outputs" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold">Responsible Institution<input name="responsible_institution" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"></label><label class="text-sm font-semibold flex items-center gap-2 mt-6"><input type="checkbox" name="active" checked> Active</label><div class="md:col-span-3 flex gap-2"><button class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold">Save Library Item</button><button type="button" id="resetBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm font-bold">Reset</button></div></form></section><section class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between mb-4"><h2 class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Library Records</h2><button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold">Refresh</button></div><div id="libraryList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div></section></main></div><script src="/assets/js/krwmp-global.js"></script><script src="/intervention-library.js"></script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Intervention Library - KRWMP Portal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="flex min-h-screen"><div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div><main class="flex-1 krwmp-page krwmp-stack-lg"><header class="krwmp-page-header"><p class="krwmp-eyebrow">Intervention Library</p><h1 class="krwmp-page-title">Admin Intervention Library</h1><p class="krwmp-body-text">Admin managed catalogue of standard watershed interventions.</p></header><section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section><section id="writePanel" class="krwmp-panel krwmp-stack-md hidden"><h2 class="krwmp-section-title">Add / Edit Library Item</h2><form id="libraryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4"><input type="hidden" name="id"><label  class="krwmp-field">Intervention Name<input name="intervention_name" required  class="krwmp-input mt-1"></label><label  class="krwmp-field">Category<input name="intervention_category"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Priority<select name="default_priority"  class="krwmp-select mt-1"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label  class="krwmp-field md:col-span-3">Description<textarea name="description" rows="3"  class="krwmp-textarea mt-1"></textarea></label><label  class="krwmp-field md:col-span-3">Standard Actions<textarea name="standard_actions" rows="3"  class="krwmp-textarea mt-1"></textarea></label><label  class="krwmp-field">Expected Outputs<input name="expected_outputs"  class="krwmp-input mt-1"></label><label  class="krwmp-field">Responsible Institution<input name="responsible_institution"  class="krwmp-input mt-1"></label><label  class="krwmp-field flex items-center gap-2 mt-6"><input type="checkbox" name="active" checked> Active</label><div class="md:col-span-3 flex gap-2"><button  class="krwmp-btn krwmp-btn-primary">Save Library Item</button><button type="button" id="resetBtn"  class="krwmp-btn krwmp-btn-secondary">Reset</button></div></form></section><section class="krwmp-panel"><div class="flex justify-between mb-4"><h2 class="krwmp-section-title">Library Records</h2><button id="refreshBtn"  class="krwmp-btn krwmp-btn-primary">Refresh</button></div><div id="libraryList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div></section></main></div><script src="/assets/js/krwmp-global.js"></script><script src="/assets/js/privilege-guard.js"></script><script src="/intervention-library.js"></script></body></html>

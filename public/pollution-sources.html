<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollution Sources - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div>
          <p class="krwmp-eyebrow">Environmental Monitoring</p>
          <h1 class="krwmp-page-title">Pollution Sources</h1>
          <p class="krwmp-body-text">View registered pollution sources and add repeated monitoring records by authorized institutions.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="/pollution-source-report.html" class="krwmp-btn krwmp-btn-primary">Report Pollution Source</a>
          <button id="reloadBtn" type="button" class="krwmp-btn krwmp-btn-secondary">Reload</button>
        </div>
      </header>

      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>
      <section id="dashboardCards" class="grid grid-cols-1 md:grid-cols-4 gap-4"></section>

      <section class="krwmp-panel krwmp-stack-md">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <input id="searchInput" class="form-input md:col-span-2" placeholder="Search source, code, DSD, GND, institution or contact person">
          <select id="riskFilter" class="form-select">
            <option value="">All Risk Classes</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Moderate">Moderate</option>
            <option value="Low">Low</option>
          </select>
          <select id="statusFilter" class="form-select">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="under_investigation">Under Investigation</option>
            <option value="controlled">Controlled</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div id="sourcesList" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <dialog id="sourceDetailModal" class="krwmp-modal krwmp-modal-xl">
    <header class="krwmp-modal-header">
      <h2 class="krwmp-modal-title">Pollution Source Details</h2>
      <button type="button" class="krwmp-modal-close" data-close-modal="sourceDetailModal" aria-label="Close details">&times;</button>
    </header>
    <div id="sourceDetailContent" class="krwmp-modal-body krwmp-stack-md"></div>
    <footer class="krwmp-modal-actions">
      <button type="button" class="krwmp-btn krwmp-btn-secondary" data-close-modal="sourceDetailModal">Close</button>
    </footer>
  </dialog>

  <dialog id="monitoringModal" class="krwmp-modal krwmp-modal-xl">
    <header class="krwmp-modal-header">
      <h2 id="monitoringModalTitle" class="krwmp-modal-title">Add Monitoring Record</h2>
      <button type="button" class="krwmp-modal-close" data-close-modal="monitoringModal" aria-label="Close monitoring">&times;</button>
    </header>
    <form id="monitoringForm" class="krwmp-modal-body grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="hidden" name="pollution_source_id" id="monitoringSourceId">
      <label class="form-label">Current Status of Source
        <select name="current_status" required class="form-select mt-1">
          <option value="">Select status</option>
          <option value="Severe Impact">Severe Impact</option>
          <option value="Controlled">Controlled</option>
          <option value="Actions Need">Actions Need</option>
          <option value="Source Not Available">Source Not Available</option>
        </select>
      </label>
      <label class="form-label">Monitoring Date
        <input name="inspection_date" type="date" class="form-input mt-1">
      </label>
      <label class="form-label md:col-span-2">Actions Recommended to Pollution Source Institution
        <select id="recommendationSelect" name="treatment_method_ids" class="form-select mt-1">
          <option value="">Select recommendation from library</option>
        </select>
      </label>
      <label id="otherRecommendationLabel" class="form-label md:col-span-2 hidden">Other Recommendation
        <textarea name="action_recommendation_other" rows="3" class="form-textarea mt-1" placeholder="Enter your own recommendation"></textarea>
      </label>
      <label class="form-label md:col-span-2">Monitoring Notes
        <textarea name="observation_summary" rows="4" class="form-textarea mt-1" placeholder="Describe present impact, compliance, action needs, and field observations"></textarea>
      </label>
      <label class="form-label md:col-span-2">Photo Evidence / File Upload
        <input id="monitoringEvidenceInput" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" multiple class="form-input mt-1">
        <span id="monitoringEvidenceStatus" class="form-helper mt-1 block">Optional. Files will be attached to this monitoring record.</span>
      </label>
      <footer class="md:col-span-2 krwmp-modal-actions">
        <button type="button" class="krwmp-btn krwmp-btn-secondary" data-close-modal="monitoringModal">Cancel</button>
        <button id="saveMonitoringBtn" type="submit" class="krwmp-btn krwmp-btn-primary">Save Monitoring Record</button>
      </footer>
    </form>
  </dialog>

  <script src="/assets/js/krwmp-global.js"></script>
  <script src="/assets/js/privilege-guard.js"></script>
  <script src="/assets/js/krwmp-file-attachments.js"></script>
  <script src="/pollution-sources.js"></script>
</body>
</html>

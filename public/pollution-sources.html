<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollution Sources - KRWMP Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex min-h-screen">
    <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>
    <main class="flex-1 krwmp-page krwmp-stack-lg">
      <header class="krwmp-page-header flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div>
          <p class="krwmp-eyebrow">Environmental Monitoring</p>
          <h1 class="krwmp-page-title">Pollution Sources</h1>
          <p class="krwmp-body-text">Register, monitor and manage point and non-point pollution sources with location, risk class and follow-up tracking.</p>
        </div>
        <button id="reloadBtn" type="button" class="krwmp-btn krwmp-btn-secondary">Reload</button>
      </header>

      <section id="statusBox" class="hidden rounded-lg p-3 text-sm"></section>

      <section id="dashboardCards" class="grid grid-cols-1 md:grid-cols-4 gap-4"></section>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-5">
        <form id="pollutionSourceForm" class="xl:col-span-1 krwmp-panel grid grid-cols-1 gap-4">
          <input type="hidden" name="id">
          <label class="form-label">Source Name
            <input name="source_name" required class="form-input mt-1" placeholder="Example: Industrial discharge point">
          </label>
          <label class="form-label">Source Type
            <select name="source_type_id" id="sourceTypeSelect" required class="form-select mt-1"></select>
          </label>
          <label class="form-label">Status
            <select name="status" class="form-select mt-1">
              <option value="active">Active</option>
              <option value="under_investigation">Under Investigation</option>
              <option value="controlled">Controlled</option>
              <option value="closed">Closed</option>
            </select>
          </label>
          <label class="form-label">Reported Date
            <input name="reported_date" type="date" class="form-input mt-1">
          </label>
          <label class="form-label">Description
            <textarea name="description" rows="3" class="form-textarea mt-1" placeholder="Describe observed pollution source, suspected activity, discharge, odour, colour, etc."></textarea>
          </label>
          <section class="krwmp-map-panel space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h2 class="form-section-heading">Location</h2>
                <p class="form-helper">Click map or use GPS. DSD/GND will be detected if available.</p>
              </div>
              <div class="flex gap-2 text-xs">
                <button type="button" data-location-gps class="krwmp-btn krwmp-btn-secondary">Use GPS</button>
                <button type="button" data-location-clear class="krwmp-btn krwmp-btn-secondary">Clear</button>
              </div>
            </div>
            <div id="pollutionLocationPicker" class="space-y-2">
              <div data-location-map class="krwmp-location-map h-72"></div>
              <p data-location-status class="krwmp-status-label">Click the map to select source location.</p>
            </div>
            <input type="hidden" name="latitude" id="latitudeInput" required>
            <input type="hidden" name="longitude" id="longitudeInput" required>
            <div id="locationInfo" class="krwmp-identify-panel">No location selected.</div>
          </section>
          <label class="form-label">Location Description
            <input name="location_description" class="form-input mt-1" placeholder="Village, road, stream, landmark">
          </label>
          <div class="flex flex-wrap gap-2">
            <button id="saveBtn" type="submit" class="krwmp-btn krwmp-btn-primary">Save Source</button>
            <button id="resetBtn" type="button" class="krwmp-btn krwmp-btn-secondary">Clear</button>
          </div>
        </form>

        <section class="xl:col-span-2 krwmp-panel krwmp-stack-md">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <input id="searchInput" class="form-input md:col-span-2" placeholder="Search source, code, DSD or GND">
            <select id="riskFilter" class="form-select">
              <option value="">All Risk Classes</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Moderate">Moderate</option>
              <option value="Low">Low</option>
            </select>
            <select id="statusFilter" class="form-select">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="under_investigation">Under Investigation</option>
              <option value="controlled">Controlled</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div id="sourcesList" class="space-y-3"></div>
        </section>
      </section>
    </main>
  </div>
  <script src="/assets/js/krwmp-global.js"></script>
  <script src="/assets/js/privilege-guard.js"></script>
  <script src="/assets/js/location-picker.js"></script>
  <script src="/pollution-sources.js"></script>
</body>
</html>

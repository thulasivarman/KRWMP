<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raster Layer Management - KRWMP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/admin-vector-layers.css">
    <link rel="stylesheet" href="/admin-vector-layers-theme.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500/30">
    <div class="flex min-h-screen">
        <div id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col"></div>

        <main class="flex-1 krwmp-page krwmp-stack-lg">
            <header class="krwmp-page-header">
                <h1 class="krwmp-page-title">Raster Layer Management</h1>
                <p class="krwmp-body-text">Upload GeoTIFF rasters. The system stores the original GeoTIFF, extracts bounds, and generates a PNG preview for browser map overlay.</p>
            </header>

            <section id="authNotice" class="auth-notice" hidden>Login required. Redirecting...</section>

            <section class="card vector-card">
                <h2 class="form-section-heading">Upload New GeoTIFF Raster Layer</h2>
                <form id="uploadRasterForm" class="form-grid">
                    <label>Layer Name<input type="text" name="name" required placeholder="Example: Land Surface Temperature" /></label>
                    <label>Layer ID<input type="text" name="id" placeholder="Auto-generated if blank" /></label>
                    <label>GeoTIFF File<input type="file" name="raster" accept=".tif,.tiff,image/tiff" required /></label>
                    <label>Opacity<input type="number" name="opacity" min="0" max="1" step="0.1" value="0.7" /></label>
                    <label>Min Zoom<input type="number" name="minZoom" min="0" max="22" value="0" /></label>
                    <label>Max Zoom<input type="number" name="maxZoom" min="0" max="22" value="22" /></label>
                    <label>Optional Bounds Override<input type="text" name="bounds" placeholder="[79.8,6.6,80.6,7.4] only if required" /></label>
                    <label>Attribution<input type="text" name="attribution" placeholder="Source / year / notes" /></label>
                    <label class="form-label flex items-center gap-2"><input type="checkbox" name="visible" class="form-checkbox"> Show layer by default</label>
                    <div class="form-actions"><button type="submit">Upload GeoTIFF</button></div>
                </form>
            </section>

            <section class="card vector-card">
                <div class="section-title-row">
                    <h2 class="form-section-heading">Existing Raster Layers</h2>
                    <button id="refreshRasterBtn" type="button">Refresh</button>
                </div>
                <div id="statusBox" class="status-box" hidden></div>
                <div id="rasterLayersList" class="layers-list"></div>
            </section>
        </main>
    </div>

    <template id="rasterLayerTemplate">
        <article class="layer-card">
            <div><h3 data-field="name"></h3><p data-field="meta"></p></div>
            <form class="style-form">
                <input type="hidden" name="id" />
                <label>Opacity<input type="number" name="opacity" min="0" max="1" step="0.1" /></label>
                <label>Min Zoom<input type="number" name="minZoom" min="0" max="22" /></label>
                <label>Max Zoom<input type="number" name="maxZoom" min="0" max="22" /></label>
                <label class="form-label flex items-center gap-2"><input type="checkbox" name="visible" class="form-checkbox"> Visible</label>
                <div class="layer-actions">
                    <button type="submit">Save Raster Settings</button>
                    <button type="button" class="danger" data-action="delete">Delete</button>
                </div>
            </form>
        </article>
    </template>

    <script src="/assets/js/krwmp-global.js"></script>
    <script src="/assets/js/privilege-guard.js"></script>
    <script src="/assets/js/ui-manager.js"></script>
    <script src="/admin-raster-layers.js"></script>
</body>
</html>

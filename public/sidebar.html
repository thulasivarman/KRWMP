            <svg class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.772-.57-.372-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z" />

<!-- MAIN NAVIGATION SCROLL CONTAINER -->
<div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">

    <a href="/map.html" id="sidebar-home-link" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:text-emerald-400 hover:bg-slate-950/40 border border-slate-800/40 hover:border-emerald-500/20 transition-all group">
        <div class="h-5 w-5 rounded-md bg-slate-950/60 border border-slate-800 flex items-center justify-center group-hover:border-emerald-500/20 group-hover:bg-emerald-500/5 transition">
            <svg class="h-3.5 w-3.5 text-slate-500 group-hover:text-emerald-400 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" />
            </svg>
        </div>
        <span>Home / Map Portal</span>
    </a>

    <div id="section-data-layers" class="bg-slate-950/20 border border-slate-800/60 rounded-xl p-3.5 shadow-sm hidden">
        <button id="menu-item-data-layers" type="button" class="w-full flex items-center justify-between text-left group">
            <div class="flex items-center gap-2">
                <svg class="h-4 w-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                </svg>
                <div>
                    <h3 class="text-xs font-bold tracking-wider text-slate-300 uppercase group-hover:text-emerald-400 transition">Data Layers</h3>
                    <p class="text-[10px] text-slate-500 mt-0.5">Open layer control panel</p>
                </div>
            </div>
            <div class="h-7 w-7 rounded-lg border border-slate-800 bg-slate-950/60 flex items-center justify-center group-hover:border-emerald-500/30 group-hover:bg-emerald-500/10 transition" title="Open Layers Panel">
                <svg class="h-4 w-4 text-slate-400 group-hover:text-emerald-400 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 16l2 2 4-4" />
                </svg>
            </div>
        </button>
    </div>

    <div class="krwmp-panel-section">
        <label for="basemap-selector" class="krwmp-panel-title">Basemap</label>
        <select id="basemap-selector" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200">
            <option value="light">Light Map</option>
            <option value="satellite">Satellite</option>
            <option value="terrain">Terrain / Topographic</option>
            <option value="hillshade">Hillshade Relief</option>
            <option value="dark">Dark Map</option>
        </select>
    </div>

    <div id="section-user-management" class="hidden mt-4 pt-4 border-t border-slate-800/60">
        <div class="px-4 block text-[9px] font-bold tracking-widest text-slate-500 uppercase mb-2">System Administration</div>
        
        <a href="/admin.html" id="sidebar-admin-link" class="mx-3 px-3 py-2 rounded-lg flex items-center gap-2.5 text-xs font-medium text-slate-400 hover:text-emerald-400 hover:bg-slate-950/40 border border-transparent hover:border-slate-800/40 transition-all group">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />

            <span>User Management Hub</span>
        </a>

        <a href="/admin-vector-layers.html" id="sidebar-vector-layer-admin-link" class="mx-3 mt-2 px-3 py-2 rounded-lg flex items-center gap-2.5 text-xs font-medium text-slate-400 hover:text-emerald-400 hover:bg-slate-950/40 border border-transparent hover:border-slate-800/40 transition-all group">

                <svg class="h-3 w-3 text-slate-500 group-hover:text-emerald-400 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4" />
                </svg>
            </div>
            <span>Vector Layer Management</span>
        </a>
    </div>

</div>

<div class="p-4 border-t border-slate-800 bg-slate-950/40 flex items-center justify-between gap-1">
    <div class="flex items-center gap-2.5 overflow-hidden flex-1">
        <div class="h-7 w-7 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center flex-shrink-0">
            <span id="userInitialsLabel" class="text-[10px] font-bold text-emerald-400 uppercase">--</span>
        </div>
        <div class="overflow-hidden">
            <h4 id="userNameLabel" class="text-xs font-semibold text-slate-300 truncate">Loading Profiles...</h4>
            <p id="userDesignationLabel" class="text-[9px] text-slate-500 truncate tracking-wide">Resolving Database Records...</p>
        </div>
    </div>
    
    <div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="window.KRWMP_ENGINE.dispatchProfileEdit()" class="text-slate-500 hover:text-emerald-400 p-1.5 rounded transition hover:bg-slate-900/60" title="Edit Profile">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        </button>
        <button onclick="window.KRWMP_ENGINE.dispatchLogout()" class="text-slate-500 hover:text-rose-400 p-1.5 rounded transition hover:bg-slate-900/60" title="Logout Session">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>

    </div>
</div>

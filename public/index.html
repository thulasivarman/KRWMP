<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRWMP Portal - Authentication Terminal</title>
    <script>
        try {
            const cachedUser = localStorage.getItem('krwmp_user');
            if (cachedUser) {
                window.location.replace('/map.html');
            }
        } catch (error) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/assets/css/style.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex items-center justify-center h-screen">

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <div class="text-center mb-6">
            <div class="h-10 w-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mx-auto mb-3">
                <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-base font-bold tracking-wider text-slate-200 uppercase">System Terminal</h2>
            <p class="text-[11px] text-slate-500 tracking-wide mt-0.5">Kelani River Basin Management Portal</p>
        </div>

        <div id="loginAlertBox" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-lg mb-4 text-center"></div>

        <form id="portalLoginForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">System Username</label>
                <input type="text" id="loginUsername" placeholder="e.g., thulasi" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50" required>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Passkey Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50" required>
            </div>

            <button type="submit" id="loginSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-xs transition shadow-lg shadow-emerald-950/20 mt-2">
                Authenticate Secure Session
            </button>
        </form>
    </div>

    <script>
        document.getElementById('portalLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlertBox');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying Credentials...";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (response.ok && result && result.success) {
                    localStorage.setItem('krwmp_user', JSON.stringify(result.user));
                    window.location.href = '/map.html';
                } else {
                    throw new Error(result.message || "Authentication rejected.");
                }
            } catch (err) {
                alertBox.innerText = err.message || "Failed to establish a link to the server.";
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = "Authenticate Secure Session";
            }
        });
    </script>
</body>
</html>
